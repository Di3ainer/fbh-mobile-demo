<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FBH scroll test</title><style>body{margin:0;font:16px/1.5 -apple-system,sans-serif}#top{position:fixed;top:0;left:0;right:0;height:40px;background:#d33;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:9}#ruler{padding-top:40px}#ruler div{height:50px;border-bottom:1px solid #ccc;padding-left:12px;line-height:50px}#info{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;font:12px monospace;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}</style></head><body><div id="top">RED = TOP OF PAGE (fixed)</div><div id="ruler"></div><div id="info"></div><script>
var r=document.getElementById("ruler");for(var i=0;i<60;i++){var d=document.createElement("div");d.textContent="Row "+i+" — "+i*50+"px";r.appendChild(d)}
function upd(){document.getElementById("info").textContent="scrollY "+Math.round(scrollY)+" · viewport "+innerWidth+"×"+innerHeight+" · iframe "+(self!==top?"YES":"no")}
addEventListener("scroll",upd);addEventListener("resize",upd);upd();
</script></body></html>
